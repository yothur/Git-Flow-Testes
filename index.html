<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <h1>Cadastro</h1>
    <form>
        <section class="blocoGeral">
            <div class="blocoNome">
                <input type="text" , placeholder="Nome" , id="Nome">
            </div>
            <div class="blocoEmail">
                <input type="email" , placeholder="Email" , id="Email">
            </div>
            <div class="blocoTelefone">
                <input type="text" , placeholder="Telefone" , id="Telefone">
            </div>
            <div class="blocoSenha">
                <input type="password" , placeholder="Senha" , id="Senha">
            </div>
            <div class="blocoBotao">
                <button id="Botao">Cadastrar</button>
            </div>
        </section>
        <div class="blocoAlteracoes">
            <spam id="Alteracao"></spam>
        </div>
    </form>
</body>
<script src="script.js"></script>

</html>
